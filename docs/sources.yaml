# Trusted documents for the Insight Agent (RAG). Every document has a named
# publisher and a URL. `make docs` downloads each one into the raw layer and
# records it in data/manifest.csv. Add Pakistani advisories here as you find
# them (keep the original publisher's URL).

- id: who_aq_factsheet
